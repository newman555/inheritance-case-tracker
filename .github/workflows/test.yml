# push とプルリクエストのたびに実行：インストール → 型チェック → すべてのテスト。
# テストは専用の SQLite データベース（prisma/test.db）を自分で作るので、シークレットは不要。
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
